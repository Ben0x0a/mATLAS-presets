preset:
  id: cdr.cdr-geo.csv-all-data
  name: CSV all Data Tableau
  os: CDR
  tool: CDR-Geo
  os_version: N/A
  version: 1.0
  tier: secondary

input_selector:
  format: csv
  name: "*AllData.csv"
  delimiter: ";"
  encoding: "utf-8"

expected_fields:
  - "Table"
  - "A_ID"
  - "A_Orig"
  - "A_Clean"
  - "A_Subscriber"
  - "A_IMEI"
  - "A_IMSI"
  - "A_IP"
  - "Type1"
  - "Type2"
  - "TimeStamp"
  - "TimeFormatted"
  - "Duration"
  - "B_ID"
  - "B_Orig"
  - "B_Clean"
  - "B_Subscriber"
  - "B_IMEI"
  - "B_IMSI"
  - "B_IP"
  - "C_ID"
  - "C_Orig"
  - "C_Clean"
  - "C_Subscriber"
  - "ThirdParties"
  - "LocOwner"
  - "SE"
  - "Address"
  - "Latitude"
  - "Longitude"
  - "CellID"
  - "GlobalCellID"
  - "Beam"
  - "Comment/Desc."
  - "CDRInfo"
  - "SourceFile"
  - "SourceRow"

# The export carries no stable per-record key (SourceFile:SourceRow locates a row, it is not
# an identifier the operator assigned), so the engine generates a deterministic UID. Stated
# rather than omitted, so a reader sees it was a decision.
source_record_uid: default

common:
  entity:          field(CDRInfo)
  entity_type:     const(device)
  source_label:    field(Table)
  position_source: const(Register)
  # A tool export: the row's origin is the operator file the extraction came from.
  raw_source_path: field(SourceFile)
  input_record_id: format("{field(SourceFile)}:{field(SourceRow)}")
  # The serving antenna is the POSITION BEARER (decisions 51, 55): the record states the
  # ANTENNA's position and the phone's link to it — the phone is a `party`, the antenna
  # holds the position, and the phone was `served` by it.
  bearer_entity:          field(GlobalCellID)
  bearer_entity_type:     const(antenna)
  bearer_identifier_type: const(cell)

observations:
  - position:
      latitude:                       field(Latitude)
      longitude:                      field(Longitude)
      position_type:              const(coordinate)
      spatial_referential:            const(epsg:4326)
      beam_azimuth_deg:               { from: field(Beam), unit: deg }
    time:
      interval:
        lower:        field(TimeStamp)
        # The operator discloses start + call length, never start + end: L1 keeps the digits
        # verbatim under the part `duration` and L2 derives the end (start_plus_duration).
        duration_sec: { from: field(Duration), unit: s }
      format:              "%Y-%m-%d %H:%M:%S"
      zone:                const(Europe/Zurich)
    links:
      # The leg records that the antenna served the phone at some point of the call, not that
      # it did for its whole duration: handovers are not recorded, so `throughout` would
      # overstate (decision 55).
      entity:   party
      spatial:  served
      temporal: at_least_once

preset:
  id: cellebrite.xml.journey
  name: Cellebrite XML Journey (Trip)
  tool: Cellebrite UFED
  version: 1.0
  tier: secondary

input_selector:
  format: xml
  name: report.xml
  namespace: http://pa.cellebrite.com/report/2.0
  model: Journey

# All output rows of one Journey (origin + destination) share this stable id.
source_record_uid: field(uuid)

lookup_tables:
  # Cellebrite's own deleted_state -> our recovery_state (decision 48; the retired
  # `deleted` field folded into this one). Intact = still in place; Deleted = a record
  # Cellebrite reconstructed. Unknown maps to nothing, so the cell stays NULL: the
  # export not saying is not the same as it saying 'live'.
  recovery: {Intact: live, Deleted: recovered}

expected_fields:
  - uuid
  - deleted_state
  - decoding_confidence
  - Source
  - Name
  - Type
  - StartTime
  - StartTime.format
  - EndTime
  - EndTime.format
  - FromPoint.Position.Latitude
  - FromPoint.Position.Longitude
  - FromPoint.TimeStamp
  - ToPoint.Position.Latitude
  - ToPoint.Position.Longitude
  - ToPoint.TimeStamp
  - ToPoint.Address.City
  - ToPoint.Address.Country

common:
  entity:          param(entity)
  entity_type:     const(device)
  source_label:    const(Journey)
  raw_source_path: field(source_path)
  recovery_state:  { from: field(deleted_state), pipe: "lookup(recovery, on_unknown=null)" }

# A Journey fans out to two observations — origin at StartTime and destination at EndTime —
# so each trip yields two output rows sharing the Journey's source_record_uid.
observations:
  - position:
      latitude:  field(FromPoint.Position.Latitude)
      longitude: field(FromPoint.Position.Longitude)
      position_type:              const(coordinate)
      spatial_referential: const(epsg:4326)   # the datum for the coordinates above
    time:
      instant: field(StartTime)
      format:  iso8601
    links:
      entity:   subject
      spatial:  measured
      temporal: at_least_once
  - position:
      latitude:  field(ToPoint.Position.Latitude)
      longitude: field(ToPoint.Position.Longitude)
      position_type:              const(coordinate)
      spatial_referential: const(epsg:4326)   # the datum for the coordinates above
    time:
      instant: field(EndTime)
      format:  iso8601
    links:
      entity:   subject
      spatial:  measured
      temporal: at_least_once
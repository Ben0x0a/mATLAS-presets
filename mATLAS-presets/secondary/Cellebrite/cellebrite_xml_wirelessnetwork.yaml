preset:
  id: cellebrite.xml.wirelessnetwork
  name: Cellebrite XML Wireless Network
  tool: Cellebrite UFED
  version: 1.0
  tier: secondary

input_selector:
  format: xml
  name: report.xml
  namespace: http://pa.cellebrite.com/report/2.0
  model: WirelessNetwork

source_record_uid: field(uuid)

lookup_tables:
  # Cellebrite's own deleted_state -> our recovery_state (decision 48; the retired
  # `deleted` field folded into this one). Intact = still in place; Deleted = a record
  # Cellebrite reconstructed. Unknown maps to nothing, so the cell stays NULL: the
  # export not saying is not the same as it saying 'live'.
  recovery: {Intact: live, Deleted: recovered}

expected_fields:
  - uuid
  - deleted_state
  - decoding_confidence
  - UserMapping
  - Source
  - SSId
  - BSSId
  - SecurityMode
  - NWConnectionType
  - LastConnection
  - LastAutoConnection
  - TimeStamp
  - TimeStamp.format
  - Position.Latitude
  - Position.Longitude
  - Position.GpsHorizontalAccuracy

common:
  entity:          param(entity)
  entity_type:     const(device)
  source_label:    const(WirelessNetwork)
  position_source: const(wifi)
  raw_source_path: field(source_path)
  recovery_state:  { from: field(deleted_state), pipe: "lookup(recovery, on_unknown=null)" }

observations:
  # A network's geolocation is often absent (lat/lon null) — the row is still a temporal
  # observation of the device seeing that SSID/BSSID.
  - position:
      latitude:              field(Position.Latitude)
      longitude:             field(Position.Longitude)
      position_type:              const(coordinate)
      spatial_referential:   const(epsg:4326)                 # the datum for the coordinates
      horizontal_accuracy_m: { from: field(Position.GpsHorizontalAccuracy), unit: m, optional: true }
    time:
      instant: field(TimeStamp)
      format:  iso8601
    links:
      entity:   subject
      spatial:  measured
      temporal: at_least_once
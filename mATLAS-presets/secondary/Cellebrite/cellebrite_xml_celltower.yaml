preset:
  id: cellebrite.xml.celltower
  name: Cellebrite XML Cell Tower
  tool: Cellebrite UFED
  version: 1.0
  tier: secondary

input_selector:
  format: xml
  name: report.xml
  namespace: http://pa.cellebrite.com/report/2.0
  model: CellTower

source_record_uid: field(uuid)

lookup_tables:
  # Cellebrite's own deleted_state -> our recovery_state (decision 48; the retired
  # `deleted` field folded into this one). Intact = still in place; Deleted = a record
  # Cellebrite reconstructed. Unknown maps to nothing, so the cell stays NULL: the
  # export not saying is not the same as it saying 'live'.
  recovery: {Intact: live, Deleted: recovered}

expected_fields:
  - uuid
  - deleted_state
  - decoding_confidence
  - UserMapping
  - Position.Latitude
  - Position.Longitude
  - TimeStamp
  - TimeStamp.format
  - Type            # GSM / LTE / ...
  - MCC
  - MNC
  - LAC
  - CID

common:
  entity:          param(entity)
  entity_type:     const(device)
  source_label:    const(CellTower)
  position_source: const(cell)
  raw_source_path: field(source_path)
  recovery_state:  { from: field(deleted_state), pipe: "lookup(recovery, on_unknown=null)" }

observations:
  - position:
      latitude:  field(Position.Latitude)
      longitude: field(Position.Longitude)
      position_type:              const(coordinate)
      spatial_referential: const(epsg:4326)   # the datum for the coordinates above
    time:
      instant: field(TimeStamp)
      format:  iso8601
    links:
      entity:   subject
      spatial:  measured
      temporal: at_least_once